name: Draft test release
on:
  push:
    tags: ['v*-rc.*']
permissions:
  contents: write
jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python tools/build_release.py --output-dir dist
      - name: Create draft pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease
          --title "FDM Mini Tools $RELEASE_TAG (experimental)"
          --notes-file docs/RELEASE_NOTES.md
          dist/*.zip dist/SHA256SUMS.txt dist/release.json
