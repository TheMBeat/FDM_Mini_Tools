name: Bug report
description: Report a reproducible problem in the experimental add-on
title: "[Bug] "
body:
  - type: input
    id: build
    attributes:
      label: Commit SHA displayed in Blender
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Blender version and operating system
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps, preset and changed settings
      description: Include strategy, contact backend, last phase and elapsed time.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots, logs or a permitted minimal model
      description: Remove personal data. Do not upload purchased or restricted models without permission.
